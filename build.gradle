plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // playerAnimator + bendy-lib (их внутри себя несёт Emotecraft 2.4.x для 1.21.1)
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:weavers-paradise:${weavers_paradise_version}"
    compileOnly "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
    compileOnly "io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

    // Для runClient: положите в run-mods/ jar-ы Weaver's Paradise, VortyLib, Curios,
    // Emotecraft и playerAnimator из своей сборки.
    runtimeOnly fileTree(dir: 'run-mods', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
